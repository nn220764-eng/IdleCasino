<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♠ Idle Casino Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <h1>♠ IDLE CASINO</h1>
  <div class="coins-display">
    <span class="coins-label">COINS</span>
    <span id="coins">500</span>
    <span id="income-per-sec">+0 /s</span>
  </div>
</div>

<div class="main">

  <!-- ── Game area ── -->
  <div class="games-area">

    <!-- Blackjack -->
    <div class="game-card" id="card-bj">
      <div class="game-header">
        <span class="game-name">♠ BLACKJACK</span>
        <span id="table-count-bj" class="table-count">1台</span>
        <span class="game-status running">● AUTO</span>
      </div>
      <div class="rtp-row">
        <span class="rtp-label">RTP</span>
        <div class="rtp-bar-bg"><div class="rtp-bar" id="rtp-bar-bj"></div></div>
        <span class="rtp-value" id="rtp-val-bj">—</span>
        <span class="rtp-delta" id="rtp-delta-bj"></span>
      </div>
      <div class="game-visual" id="visual-bj">
        <div class="cards-area">
          <div class="cards-label">DEALER</div>
          <div class="cards-row" id="dealer-cards">
            <div class="card">A</div>
            <div class="card face-down">?</div>
          </div>
          <div class="cards-label">PLAYER (AI)</div>
          <div class="cards-row" id="player-cards">
            <div class="card red">7</div>
            <div class="card red">8</div>
          </div>
        </div>
      </div>
      <div id="table-actions-bj" class="table-actions"></div>
    </div>

    <!-- Slots -->
    <div class="game-card" id="card-slots">
      <div class="game-header">
        <span class="game-name">🎰 SLOTS</span>
        <span id="table-count-slots" class="table-count"></span>
        <span class="game-status locked-status">LOCKED</span>
      </div>
      <div class="rtp-row">
        <span class="rtp-label">RTP</span>
        <div class="rtp-bar-bg"><div class="rtp-bar" id="rtp-bar-slots"></div></div>
        <span class="rtp-value" id="rtp-val-slots">—</span>
        <span class="rtp-delta" id="rtp-delta-slots"></span>
      </div>
      <div class="game-visual" id="visual-slots">
        <div class="slots-display">
          <div class="slot-reel" id="reel-0">🍒</div>
          <div class="slot-reel" id="reel-1">🍋</div>
          <div class="slot-reel" id="reel-2">⬜</div>
        </div>
      </div>
      <div id="table-actions-slots" class="table-actions"></div>
    </div>

    <!-- Roulette -->
    <div class="game-card" id="card-roulette">
      <div class="game-header">
        <span class="game-name">🎡 ROULETTE</span>
        <span id="table-count-roulette" class="table-count"></span>
        <span class="game-status locked-status">LOCKED</span>
      </div>
      <div class="rtp-row">
        <span class="rtp-label">RTP</span>
        <div class="rtp-bar-bg"><div class="rtp-bar" id="rtp-bar-roulette"></div></div>
        <span class="rtp-value" id="rtp-val-roulette">—</span>
        <span class="rtp-delta" id="rtp-delta-roulette"></span>
      </div>
      <div class="game-visual" id="visual-roulette">
        <div class="roulette-display">
          <div class="roulette-wheel" id="roulette-wheel">
            <div class="roulette-ball"></div>
          </div>
          <div class="roulette-info">
            <div class="roulette-last" id="roulette-last">Last: —</div>
            <div style="font-size:9px;color:#333;margin-top:2px" id="roulette-status">waiting...</div>
          </div>
        </div>
      </div>
      <div id="table-actions-roulette" class="table-actions"></div>
    </div>

    <!-- Baccarat — Phase 2 -->
    <div class="game-card locked" id="card-baccarat">
      <div class="game-header">
        <span class="game-name">🃏 BACCARAT</span>
        <span class="game-status locked-status">COMING SOON</span>
      </div>
      <div class="game-visual">
        <div class="locked-content">
          <div class="locked-icon">🔒</div>
          <div class="locked-text">Phase 2 で実装予定</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Upgrade panel ── -->
  <div class="upgrade-panel">
    <div class="upgrade-panel-header">UPGRADES</div>
    <div id="upgrade-list"></div>
    <div class="total-income">
      <div class="total-income-label">TOTAL INCOME</div>
      <div class="total-income-value" id="income-per-sec-panel">+0 /s</div>
    </div>
  </div>

</div>

<!-- ── Activity log ── -->
<div class="log-area">
  <div id="log-entries"></div>
</div>

<!-- ── Offline income modal ── -->
<div class="offline-modal" id="offline-modal">
  <div class="offline-box">
    <h2>WELCOME BACK</h2>
    <p>留守の間、カジノが稼ぎ続けました</p>
    <div class="offline-amount" id="offline-amount">+0</div>
    <p id="offline-time"></p>
    <button class="offline-btn" id="offline-btn">COLLECT</button>
  </div>
</div>

<script type="module">
  import { init, state } from './src/game/idle-loop.js'

  // Offline income modal
  let _lastHiddenTime = null

  function showOfflineModal(earned, elapsedSec) {
    const modal  = document.getElementById('offline-modal')
    const amount = document.getElementById('offline-amount')
    const time   = document.getElementById('offline-time')
    const btn    = document.getElementById('offline-btn')

    amount.textContent = `+${earned.toLocaleString()} coins`
    const hours   = Math.floor(elapsedSec / 3600)
    const minutes = Math.floor((elapsedSec % 3600) / 60)
    time.textContent = hours > 0
      ? `${hours}時間${minutes}分 の収益`
      : `${minutes}分 の収益`

    modal.classList.add('show')
    btn.onclick = () => modal.classList.remove('show')
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      _lastHiddenTime = Date.now()
    } else if (_lastHiddenTime) {
      const elapsedSec = (Date.now() - _lastHiddenTime) / 1000
      if (elapsedSec >= 30) {
        const earned = Math.floor(elapsedSec * state.coinsPerSec)
        if (earned > 0) showOfflineModal(earned, elapsedSec)
      }
      _lastHiddenTime = null
    }
  })

  init()
</script>

</body>
</html>
